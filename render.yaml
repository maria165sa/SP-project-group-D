# Render Blueprint para deployment automático
# Coloca este archivo en la raíz del proyecto

services:
  # Backend - FastAPI
  - type: web
    name: sp-backend
    runtime: python
    region: frankfurt  # o la región que prefieras
    plan: free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true

  # Frontend - React (Static Site)
  - type: web
    name: sp-frontend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://sp-backend.onrender.com  # ⚠️ CAMBIAR por tu URL real del backend
    rootDir: frontend
    autoDeploy: true