# Render Blueprint para deployment automático
# Coloca este archivo en la raíz del proyecto

services:
  # Backend - FastAPI
  - type: web
    name: sp-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true

  # Frontend - React (Static Site)
  - type: web
    name: sp-frontend
    runtime: static
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true